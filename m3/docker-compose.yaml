services:
  nats:
    image: nats:latest
    restart: always
    command: -c /etc/nats/nats.conf
    ports:
      - "4222:4222"
      - "6222:6222"
      - "7422:7422"
      - "8222:8222"
      - "10443:443"
    volumes:
       - ./nats.conf/:/etc/nats/nats.conf
 
  cmd:
    image: foliage-demo/cmd:latest
    restart: always
    command: /usr/bin/runtime -ll 6
    env_file: cmd/.env
    depends_on:
      - nats
    build:
      context: ..
      dockerfile: m3/cmd/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://cmd:9000/health"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ./cmd/data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  cn-json-file:
    image: foliage-demo/cn-file:latest
    restart: always
    command: /usr/bin/runtime -ll 6
    env_file: connectors/json_file/.env
    depends_on:
      cmd:
        condition: service_healthy
    build:
      context: ..
      dockerfile: m3/connectors/json_file/Dockerfile
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  ad-arch-model:
    image: foliage-demo/ad-arch:latest
    restart: always
    command: /usr/bin/runtime -ll 6
    env_file: adapters/arch_model/.env
    depends_on:
      cmd:
        condition: service_healthy
    build:
      context: ..
      dockerfile: m3/adapters/arch_model/Dockerfile
    logging:
      options:
        max-size: "10m"
        max-file: "5"