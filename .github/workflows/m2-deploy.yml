name: Deploy m2

on:
  push:
    branches: [ dev ]
    paths:
      - 'm2/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, m2]

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd m2
          docker compose build  

      - name: Stop and cleanup
        run: |
          docker compose -p m2 -f m2/docker-compose.yaml down -v --remove-orphans

      - name: Deploy m2
        run: |
          cd m2
          docker compose up -d

